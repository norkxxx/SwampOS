<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">SwampGuard volume-scoped identity</title><desc id="d">Two EXT4 volumes with different UUIDs keep independent policies for the same inode number; a remount of the same UUID retains its policy.</desc><defs><linearGradient id="bg"><stop stop-color="#07130c"/><stop offset="1" stop-color="#183b25"/></linearGradient></defs><rect width="900" height="390" rx="16" fill="url(#bg)"/><g font-family="monospace" fill="#b9dfc1"><text x="38" y="46" font-size="20" fill="#8ac396">SWAMP MATRIX // SWAMPGUARD</text><text x="38" y="86" font-size="30" font-weight="bold">VOLUME-SCOPED IDENTITY</text><rect x="38" y="120" width="350" height="92" rx="9" fill="#102719" stroke="#75b88b" stroke-width="2"/><rect x="512" y="120" width="350" height="92" rx="9" fill="#102719" stroke="#75b88b" stroke-width="2"/><text x="58" y="153" font-size="17">EXT4 VOLUME A</text><text x="58" y="181" font-size="15" fill="#8ac396">UUID: ...0001 / inode: 42</text><text x="532" y="153" font-size="17">EXT4 VOLUME B</text><text x="532" y="181" font-size="15" fill="#8ac396">UUID: ...0002 / inode: 42</text><path d="M213 212v42h237m237-42v42H450" stroke="#75b88b" stroke-width="2" fill="none"/><rect x="270" y="254" width="360" height="82" rx="9" fill="#28563a" stroke="#9bd6a7" stroke-width="2"/><text x="450" y="285" text-anchor="middle" font-size="18" font-weight="bold">SEPARATE GUARD PROFILES</text><text x="450" y="311" text-anchor="middle" font-size="14">UUID[16] + inode → capability ceiling</text><text x="450" y="365" text-anchor="middle" font-size="13" fill="#8ac396">SAME UUID REMOUNT → SAME SESSION POLICY · CLONED UUID → SHARED POLICY</text></g></svg>