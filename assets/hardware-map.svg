<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title"><title id="title">SwampOS hardware discovery, separate lab and locked boot paths</title><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#244735" opacity=".55"/></pattern></defs><rect width="1200" height="400" rx="16" fill="#09160e"/><rect width="1200" height="400" fill="url(#grid)" rx="16"/><g font-family="monospace"><text x="40" y="43" font-size="20" fill="#9bd6a7">SWAMP MATRIX // 008 / HARDWARE DISCOVERY</text><g stroke="#548d72" fill="#173423" stroke-width="2"><rect x="40" y="85" width="260" height="82" rx="8"/><rect x="40" y="219" width="260" height="82" rx="8"/><rect x="350" y="85" width="300" height="82" rx="8"/><rect x="350" y="219" width="300" height="82" rx="8"/><rect x="700" y="85" width="460" height="216" rx="8"/><path d="M300 126H350 M650 126H700 M300 260H350" fill="none"/></g><g fill="#b9e1c4" font-size="20"><text x="58" y="115">UEFI KERNEL LAB</text><text x="58" y="143" font-size="14">unsigned / no secrets</text><text x="58" y="249">LOCKED BOOT</text><text x="58" y="277" font-size="14">independent chain</text><text x="368" y="115">EXIT BOOT SERVICES</text><text x="368" y="143" font-size="14">memory map / GDT / paging</text><text x="368" y="249">SWAMPLOGIN</text><text x="368" y="277" font-size="14">no backend / no key release</text><text x="720" y="117">SWAMPKERNEL / x86_64</text><text x="720" y="151" font-size="17">CPU + ACPI + PCI inventory</text><text x="720" y="181" font-size="17">PS/2 input + GOP metadata</text><text x="720" y="211" font-size="17">GPT slice → EXT4 RO</text><text x="720" y="241" font-size="17">Offline ARP / ICMP / UDP</text><text x="720" y="274" font-size="13" fill="#bba46d">GUEST RUNTIME NOT VERIFIED</text></g><text x="40" y="358" font-size="15" fill="#85aa90">SECURITY HAS LAYERS. // TRUSTED AUTHENTICATION IS STILL A RELEASE GATE.</text></g></svg>
