<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title"><title id="title">Connectivity laboratory and isolated policy models</title><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1c3527"/></pattern></defs><rect width="1200" height="420" rx="16" fill="#09150e"/><rect width="1200" height="420" rx="16" fill="url(#grid)"/><g font-family="monospace" fill="#a7d6b3"><text x="36" y="44" font-size="19">SWAMPNET // EXPLICIT LAB PATH</text><g stroke="#6ca981" fill="#172f20" stroke-width="2"><rect x="36" y="75" width="245" height="100" rx="9"/><rect x="330" y="75" width="245" height="100" rx="9"/><rect x="624" y="75" width="245" height="100" rx="9"/><rect x="918" y="75" width="245" height="100" rx="9"/><path d="M281 125H330M575 125H624M869 125H918" fill="none"/><rect x="36" y="255" width="350" height="100" rx="9"/><rect x="425" y="255" width="350" height="100" rx="9"/><rect x="814" y="255" width="349" height="100" rx="9" stroke-dasharray="5 5"/></g><g text-anchor="middle" font-size="18"><text x="158" y="113">LOCAL QEMU PEER</text><text x="452" y="113">VIRTIO LEGACY</text><text x="746" y="113">FRAME ENGINE</text><text x="1040" y="113">BOUNDED REPLY</text><text x="211" y="295">SWAMPWALL MODEL</text><text x="600" y="295">VPN POLICY MODEL</text><text x="988" y="295">APP SOCKETS / TUNNEL</text></g><g text-anchor="middle" font-size="14" fill="#87a990"><text x="158" y="144">loopback socket only</text><text x="452" y="144">explicit netlab session</text><text x="746" y="144">ARP / ICMP / UDP</text><text x="1040" y="144">no routing / NAT</text><text x="211" y="325">exact app + endpoint grant</text><text x="600" y="325">fail-closed route decision</text><text x="988" y="325">not implemented</text></g><text x="36" y="224" font-size="17" fill="#79bc8e">SEPARATE HOST-TESTED POLICY MODELS — NOT ATTACHED TO THE NIC</text><text x="36" y="395" font-size="15">No default network access. No real VPN. Guest runtime verification pending.</text></g></svg>
