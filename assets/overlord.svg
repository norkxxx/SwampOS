<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title"><title id="title">Overlord process scheduler and isolation boundaries</title><rect width="1000" height="430" rx="12" fill="#09150e"/><g font-family="monospace" text-anchor="middle"><text x="500" y="33" fill="#b2e3bf" font-size="22">DONKEY / OVERLORD — SINGLE CPU PROCESS GROUP</text><rect x="340" y="60" width="320" height="80" rx="6" fill="#183923" stroke="#76b58b"/><text x="500" y="87" fill="#c0e8c9" font-size="17">PIT IRQ / SYSCALL GATE</text><text x="500" y="112" fill="#90bd9b" font-size="14">2-tick quantum / 100 charged ticks</text><path d="M500 140V166H126V190M500 166H375V190M500 166H625V190M500 166H874V190" fill="none" stroke="#78b78a" stroke-width="2"/><g fill="#173421" stroke="#76b58b"><rect x="20" y="190" width="212" height="135" rx="8"/><rect x="269" y="190" width="212" height="135" rx="8"/><rect x="519" y="190" width="212" height="135" rx="8"/><rect x="768" y="190" width="212" height="135" rx="8"/></g><g fill="#c0e8c9" font-size="16"><text x="126" y="218">P0 / CR3 #1</text><text x="375" y="218">P1 / CR3 #2</text><text x="625" y="218">P2 / CR3 #3</text><text x="874" y="218">P3 / CR3 #4</text></g><g fill="#90bd9b" font-size="14"><text x="126" y="248">RX / RW-NX / stack</text><text x="375" y="248">RX / RW-NX / stack</text><text x="625" y="248">RX / RW-NX / stack</text><text x="874" y="248">RX / RW-NX / stack</text><text x="126" y="276">Private scratch + FIFO</text><text x="375" y="276">Private scratch + FIFO</text><text x="625" y="276">Private scratch + FIFO</text><text x="874" y="276">Private scratch + FIFO</text></g><path d="M126 325V351H874V325M375 325V351M625 325V351" fill="none" stroke="#78b78a" stroke-dasharray="5 5"/><text x="500" y="381" fill="#b2e3bf" font-size="16">Explicit per-slot capabilities • no cross-group IPC</text><text x="500" y="405" fill="#8cad95" font-size="12">Compiled and host-simulated; actual guest CPU enforcement pending.</text></g></svg>
