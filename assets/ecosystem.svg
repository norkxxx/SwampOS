<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">SwampOS Ecosystem architecture</title><desc id="d">Three separate paths: host package staging, native SDK on the public disk, and independent UEFI graphics lab</desc><rect width="1200" height="380" rx="16" fill="#09170f"/><g font-family="monospace"><text x="30" y="42" fill="#a8d7b4" font-size="20" font-weight="bold">ECOSYSTEM / THREE EXPLICIT TRUST BOUNDARIES</text><g fill="#173625" stroke="#5d8c6b" stroke-width="2"><rect x="30" y="70" width="360" height="260" rx="10"/><rect x="420" y="70" width="360" height="260" rx="10"/><rect x="810" y="70" width="360" height="260" rx="10"/></g><g fill="#c0e8c9" font-size="20" font-weight="bold"><text x="50" y="105">01 / HOST STORE</text><text x="440" y="105">02 / NATIVE ABI</text><text x="830" y="105">03 / FIRMWARE GUI</text></g><g fill="#9fc2a9" font-size="17"><text x="50" y="148">Ed25519 + SHA-256</text><text x="50" y="190">Exact dependencies</text><text x="50" y="232">Atomic snapshot / rollback</text><text x="440" y="148">C SDK / ELF64</text><text x="440" y="190">Public EXT4 demo volume</text><text x="440" y="232">Console capability / audit</text><text x="830" y="148">Clipped software renderer</text><text x="830" y="190">Independent GUILAB.EFI</text><text x="830" y="232">UEFI GOP / static scene</text></g><g fill="#e4c890" font-size="14"><text x="50" y="302">NO GUEST INSTALL / NO SCRIPTS</text><text x="440" y="302">GUEST EXECUTION UNVERIFIED</text><text x="830" y="302">NOT THE LOGIN ENVIRONMENT</text></g><text x="30" y="360" font-size="14" fill="#83aa8e">NO IMPLICIT TRUST TRANSFER BETWEEN THESE PATHS.</text></g></svg>
